# nginx serves the React app and proxies /api to backend-service:8081.
apiVersion: v1
kind: Service
metadata:
  name: staff-frontend-service
  namespace: order-agent
spec:
  type: NodePort
  selector:
    app: staff-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30882
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-frontend
  namespace: order-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staff-frontend
  template:
    metadata:
      labels:
        app: staff-frontend
    spec:
      containers:
        - name: staff-frontend
          image: ghcr.io/trantheanh135/order-agent-staff-frontend:c32aa8873135105aca2711ea8d2ca3c737dd7638
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 200m}
