# nginx serves the React app and proxies /api to backend-service:8081.
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend-service
  namespace: order-agent
spec:
  type: NodePort
  selector:
    app: customer-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: order-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-frontend
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: customer-frontend
          image: ghcr.io/trantheanh135/order-agent-customer-frontend:3721cb429d67465cec197ded325919d0e7615b6b
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 200m}
